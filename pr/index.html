<style>
html[data-mode="light"]{--ink:#14544A;--ink-rgb:20,84,74;--paper:#EBF0EC;}
html[data-mode="dark"]{--ink:#7FD8C0;--ink-rgb:127,216,192;--paper:#061412;}
:root{
  --ink-85:rgba(var(--ink-rgb),.85);
  --ink-60:rgba(var(--ink-rgb),.60);
  --ink-38:rgba(var(--ink-rgb),.38);
  --ink-18:rgba(var(--ink-rgb),.18);
  --ink-08:rgba(var(--ink-rgb),.08);
  --hair:.75px;
  --gut:clamp(16px,5vw,48px);
  --maxw:820px;
  --navh:52px;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Bai Jamjuree","Noto Sans TC",system-ui,sans-serif;
  font-weight:400;line-height:1.6;letter-spacing:.01em;
  transition:background .3s ease,color .3s ease;
  -webkit-text-size-adjust:100%;
}
a{color:inherit;}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--paper);
  border-bottom:var(--hair) solid var(--ink-18);
}
.topbar-in{
  max-width:var(--maxw);margin:0 auto;padding:12px var(--gut);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.brand{font-family:"Bai Jamjuree",sans-serif;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;}
.brand small{display:block;font-family:"Noto Sans TC",sans-serif;font-weight:500;font-size:11px;letter-spacing:.02em;color:var(--ink-60);margin-top:2px;}
.iconbtn{
  width:34px;height:34px;border:1.4px solid var(--ink-38);border-radius:50%;
  background:none;color:var(--ink);cursor:pointer;font-size:15px;
  display:flex;align-items:center;justify-content:center;flex:none;
}
.tabbar{
  position:sticky;top:var(--navh);z-index:19;background:var(--paper);
  border-bottom:var(--hair) solid var(--ink-18);
  overflow-x:auto;scrollbar-width:none;
}
.tabbar::-webkit-scrollbar{display:none;}
.tabbar-in{
  max-width:var(--maxw);margin:0 auto;padding:0 var(--gut);
  display:flex;gap:2px;
}
.tabbar button{
  font-family:"Bai Jamjuree",sans-serif;font-size:12.5px;font-weight:700;letter-spacing:.06em;
  background:none;border:none;color:var(--ink-60);cursor:pointer;
  padding:12px 12px;white-space:nowrap;border-bottom:2.4px solid transparent;
  flex:none;
}
.tabbar button b{display:block;font-size:15px;}
.tabbar button i{display:block;font-style:normal;font-size:9px;letter-spacing:.12em;margin-top:1px;}
.tabbar button.on{color:var(--ink);border-bottom-color:var(--ink);}
.wrap{max-width:var(--maxw);margin:0 auto;padding:22px var(--gut) 80px;}
.panel{display:none;}
.panel.on{display:block;}
.sec-head{margin-bottom:16px;}
.sec-head h2{font-family:"Noto Sans TC",sans-serif;font-weight:900;font-size:clamp(19px,3.4vw,24px);margin:0 0 4px;letter-spacing:.02em;}
.sec-head p{margin:0;font-size:12.5px;color:var(--ink-60);}

/* ── vocab ── */
.catbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;position:sticky;top:calc(var(--navh) + 45px);background:var(--paper);padding:8px 0;z-index:5;}
.catbar button{
  font-family:"Noto Sans TC",sans-serif;font-size:11.5px;font-weight:700;
  border:1.4px solid var(--ink-38);border-radius:999px;background:none;color:var(--ink-60);
  padding:5px 12px;cursor:pointer;white-space:nowrap;
}
.catbar button.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.cat-block{margin-bottom:28px;}
.cat-block h3{
  font-family:"Bai Jamjuree",sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-60);margin:0 0 10px;
  border-bottom:var(--hair) solid var(--ink-18);padding-bottom:6px;
}
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.vcard{
  border:1.4px solid var(--ink-18);border-radius:10px;padding:12px 13px;cursor:pointer;
  min-height:88px;position:relative;background:var(--paper);
  transition:border-color .15s ease;
}
.vcard:active{border-color:var(--ink);}
.vcard .en{font-family:"Bai Jamjuree",sans-serif;font-weight:700;font-size:15px;line-height:1.3;}
.vcard .zh{font-family:"Noto Sans TC",sans-serif;font-size:12.5px;color:var(--ink-60);margin-top:5px;display:none;}
.vcard .ex{font-family:"Noto Sans TC",sans-serif;font-size:11px;color:var(--ink-38);margin-top:6px;line-height:1.5;display:none;font-style:italic;}
.vcard.flip .zh,.vcard.flip .ex{display:block;}
.vcard .spk{
  position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;
  border:1.2px solid var(--ink-38);background:none;color:var(--ink);font-size:11px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.hint{font-size:11px;color:var(--ink-38);margin-bottom:14px;}

/* ── dialogue ── */
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px;flex-wrap:wrap;}
.togglezh{
  font-family:"Bai Jamjuree",sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;
  border:1.4px solid var(--ink-38);border-radius:999px;background:none;color:var(--ink);
  padding:6px 13px;cursor:pointer;flex:none;
}
.togglezh.off{opacity:.5;}
.convo{margin-top:18px;display:flex;flex-direction:column;gap:10px;}
.bub-row{display:flex;gap:8px;}
.bub-row.you{justify-content:flex-end;}
.bub-row.you .bub{align-items:flex-end;}
.bub{
  max-width:78%;display:flex;flex-direction:column;gap:2px;
}
.who{font-family:"Bai Jamjuree",sans-serif;font-size:9px;font-weight:700;letter-spacing:.16em;
  color:var(--ink-38);text-transform:uppercase;margin-bottom:2px;}
.bub-row.you .who{text-align:right;}
.bub .en{
  font-family:"Noto Sans TC",sans-serif;font-size:14.5px;font-weight:500;line-height:1.5;
  border:1.4px solid var(--ink-18);border-radius:14px;padding:9px 13px;position:relative;
}
.bub-row.friend .en{border-top-left-radius:3px;}
.bub-row.you .en{border-top-right-radius:3px;background:var(--ink-08);}
.bub .zh{font-family:"Noto Sans TC",sans-serif;font-size:11.5px;color:var(--ink-60);padding:0 13px;}
.bub-row.you .zh{text-align:right;}
.body.hidezh .zh{display:none;}
.spk-line{
  display:inline-flex;align-items:center;justify-content:center;
  width:20px;height:20px;border-radius:50%;border:1px solid var(--ink-38);
  background:none;color:var(--ink);font-size:9px;cursor:pointer;margin-left:6px;vertical-align:middle;
}

/* ── footer ── */
.back{
  display:block;text-align:center;margin-top:40px;padding-top:20px;
  border-top:var(--hair) solid var(--ink-18);font-size:12px;color:var(--ink-60);text-decoration:none;
}
::selection{background:var(--ink);color:var(--paper);}
</style>
</head>

    ["friend","Was the guesthouse wifi good on the first night?","第一晚民宿的網路好嗎？"],
    ["you","Really fast, I could even video call my family right away.","很快，我甚至馬上就能跟家人視訊。"],
    ["friend","Overall, how would you describe your first night in Seoul?","整體來說，妳會怎麼形容在首爾的第一晚？"],
    ["you","Tiring but exciting, the perfect start to a busy trip.","很累但很興奮，是這趟忙碌旅程完美的開始。"],
  ]},
  d0826:{title:"8/26 · 韓服景福宮醫美 Swing", lines:[
    ["friend","So today's the hanbok day! How did it go?","今天是韓服日！狀況怎麼樣？"],
    ["you","It was fun, but the rental time was shorter than I expected.","很好玩，不過租借時間比我想的短。"],
    ["friend","What do you mean?","怎麼說？"],
    ["you","I thought I booked 4 hours, but it was actually only 3.","我以為訂了 4 小時，結果其實只有 3 小時。"],
    ["friend","Oh no, did that mess up your schedule?","天啊，這樣打亂行程了嗎？"],
    ["you","A little, I had less time for photos at the palace than planned.","有一點，在宮殿拍照的時間比原本規劃的少。"],
    ["friend","Did you see the changing of the guard ceremony?","你有看到守門將換崗儀式嗎？"],
    ["you","Yes! It happened right in my photo window, lucky timing.","有！剛好在我拍照的時段發生，運氣很好。"],
    ["friend","What did you do after returning the hanbok?","還完韓服之後你做了什麼？"],
    ["you","I went to a clinic in Myeongdong for a skin consultation.","我去明洞的診所做皮膚諮詢。"],
    ["friend","How was the consultation?","諮詢結果怎麼樣？"],
    ["you","I ended up spending more than my budget, almost 24% over.","我最後花超過預算了，多了將近 24%。"],
    ["friend","What treatments did you get?","妳做了什麼療程？"],
    ["you","A lifting procedure and a filler for my nasolabial folds.","一個拉提療程，還有法令紋填充劑。"],
    ["friend","I hope it's worth it! What about tonight?","希望值得！那今晚呢？"],
    ["you","I'm going to a swing dance social in Itaewon.","我要去梨泰院參加搖擺舞社交場。"],
    ["friend","Have you ever danced swing before?","妳跳過搖擺舞嗎？"],
    ["you","Never, but there's a free beginner class before the social dance.","從沒跳過，不過社交場前有免費的初學者課程。"],
    ["friend","That sounds exciting! Are you nervous?","聽起來很刺激！會緊張嗎？"],
    ["you","A little, but everyone says the community is really friendly to beginners.","有一點，不過大家都說這個社群對新手很友善。"],
    ["friend","Wait, go back — what was the clinic actually like inside?","等等，回到剛剛——診所裡面實際上是什麼樣子？"],
    ["you","It was inside an office building, not what I expected at all.","是在一棟辦公大樓裡，跟我想的完全不一樣。"],
    ["friend","What do you mean?","怎麼說？"],
    ["you","The staff were really warm, it didn't feel like an assembly line at all.","服務人員都很親切，完全沒有流水線的感覺。"],
    ["friend","That's reassuring. What did you end up choosing?","聽起來滿讓人安心的。妳最後選了什麼？"],
    ["you","Within my budget, I picked water-light injections and a lifting treatment.","在預算內，我選了水光針跟拉提。"],
    ["friend","What's a water-light injection exactly?","水光針到底是什麼？"],
    ["you","It's literally injections — one needle holds about 5cc of solution for the whole face.","就是打針，一支針大概有 5cc 的用量，打全臉。"],
    ["friend","That sounds intense. Did they numb your face first?","聽起來很有感。他們有先打麻藥嗎？"],
    ["you","Yes, they applied numbing cream to my whole face before starting.","有，開始前先在整張臉敷了麻藥。"],
    ["friend","Did the numbing cream actually help?","麻藥有真的有用嗎？"],
    ["you","Honestly, it still hurt more than any skincare I've ever done.","老實說，還是比我做過的任何保養都痛。"],
    ["friend","What did it actually feel like?","實際上是什麼感覺？"],
    ["you","You can clearly feel the needle poking in, again and again.","你可以很明顯感覺到針一直在戳進去的感覺。"],
    ["friend","Okay, switching topics — what was the swing venue like?","好，換個話題——搖擺舞的場地怎麼樣？"],
    ["you","It was a really vintage-style bar, very cozy.","是很復古風格的酒吧，很有氛圍。"],
    ["friend","How many leaders were there that night?","那晚有幾位 leader？"],
    ["you","Only five, so I ended up dancing with every single one of them.","只有五個，所以我最後跟每一個都跳過了。"],
    ["friend","Did you try any drinks there?","有點什麼飲料嗎？"],
    ["you","I ordered a gin and lemon cocktail — I really liked it.","我點了一杯檸檬琴酒，很喜歡。"],
    ["friend","Did you get good photos at the palace despite the shorter time?","雖然時間比較短，宮殿的照片還拍得好嗎？"],
    ["you","Yes, actually, I focused on just a few good spots instead of rushing everywhere.","有，我專注拍幾個好地點，而不是到處趕場。"],
    ["friend","Was the hanbok comfortable to wear?","韓服穿起來舒服嗎？"],
    ["you","Pretty comfortable, though the skirt was heavier than I expected.","滿舒服的，不過裙子比我想的重。"],
    ["friend","How was the weather for photos?","拍照時天氣怎麼樣？"],
    ["you","Hot and humid, but at least it wasn't raining.","又熱又濕，不過至少沒下雨。"],
    ["friend","Did you have to make an appointment for the clinic in advance?","診所是要事先預約嗎？"],
    ["you","Yes, I booked it a few days before through an app.","對，我提前幾天透過 App 預約好了。"],
    ["friend","Was the clinic staff able to speak English?","診所人員會說英文嗎？"],
    ["you","A little, but they also had a translation tablet for detailed questions.","會一點，詳細問題他們也有翻譯平板。"],
    ["friend","Did they explain the recovery process?","他們有解釋恢復期嗎？"],
    ["you","Yes, mostly just avoid sun and heat for a few days.","有，主要就是幾天內避免曬太陽跟高溫。"],
    ["friend","Are you worried about the extra cost?","會擔心超支的部分嗎？"],
    ["you","A bit, but I think it was worth trying at least once.","有一點，不過我覺得至少試一次是值得的。"],
    ["friend","Did you dance with anyone interesting at the swing social?","搖擺舞社交場有跟誰跳得特別印象深刻嗎？"],
    ["you","Yes, one of the leaders taught me a few basic steps before the dancing started.","有，開跳前一位 leader 教了我幾個基本步。"],
    ["friend","Would you go to another swing social again?","還會想再去別的搖擺舞場嗎？"],
    ["you","Definitely, I really want to improve before the next one.","一定會，我很想在下次之前多進步一點。"],
    ["friend","What time did the social end?","社交場幾點結束？"],
    ["you","It wrapped up around midnight, later than I planned.","大概午夜結束，比我原本計畫的晚。"],
  ]},
  d0827:{title:"8/27 · 南怡島 Hong Turn", lines:[
    ["friend","Tell me about your day trip to Nami Island!","跟我說說南怡島一日遊！"],
    ["you","It was beautiful, but the train schedule was a bit stressful.","很美，不過火車班次讓我有點緊張。"],
    ["friend","What happened?","發生什麼事了？"],
    ["you","My target return train was full, so I had to wait for a later one.","我目標的回程車滿了，只好等下一班。"],
    ["friend","Did that cause any problems?","這有造成什麼問題嗎？"],
    ["you","I got back to my guesthouse about thirty minutes later than planned.","我回到民宿的時間比計畫晚了大約三十分鐘。"],
    ["friend","What's Nami Island actually like?","南怡島實際上是什麼樣子？"],
    ["you","It has a famous tree-lined path, really scenic for photos.","那裡有一條有名的林蔭步道，很適合拍照。"],
    ["friend","Did you rent a bike there?","妳有在那邊租腳踏車嗎？"],
    ["you","I considered it, but I mostly just walked around.","有考慮過，不過我大部分時間都用走的。"],
    ["friend","How did you get to the island from Seoul?","妳怎麼從首爾到島上的？"],
    ["you","I took the ITX train to Gapyeong, then a short taxi to the ferry pier.","我搭 ITX 到加平，再搭一小段計程車到渡船口。"],
    ["friend","Was the ferry ticket expensive?","渡輪票貴嗎？"],
    ["you","Not really, I booked a combo ticket online beforehand.","還好，我事先在網路上訂了套票。"],
    ["friend","What are you doing tonight?","今晚要做什麼？"],
    ["you","I'm going to a Latin dance club called Hong Turn.","我要去一間叫 Hong Turn 的拉丁舞俱樂部。"],
    ["friend","Salsa or bachata?","騷莎還是巴恰塔？"],
    ["you","Tonight is Bachata Day, so mostly bachata.","今晚是巴恰塔日，主要是巴恰塔。"],
    ["friend","Have you tried bachata before?","妳跳過巴恰塔嗎？"],
    ["you","A little bit, I'm excited to practice more tonight.","跳過一點點，很期待今晚多練習。"],
    ["friend","How complicated was the transportation, actually?","交通實際上有多複雜？"],
    ["you","Pretty complicated — two subway transfers, then the ITX train, then a bus, then a ferry.","滿複雜的——先轉了兩次地鐵，再轉 ITX，然後轉公車，最後還要搭船。"],
    ["friend","That's a lot of transfers for one island!","去一個島要轉這麼多趟！"],
    ["you","It really was, but it was completely worth it once I got there.","真的是，不過到了之後完全值得。"],
    ["friend","What did you love most about the island?","妳最喜歡島上的什麼？"],
    ["you","The tall trees everywhere, and almost no mosquitoes at all.","到處都是高聳的樹木，而且幾乎沒有蚊蟲。"],
    ["friend","That's rare for August!","八月能這樣真的很難得！"],
    ["you","I know! And I kept running into squirrels and all kinds of cute rabbits.","對啊！而且一直遇到松鼠，還有各式各樣可愛的兔子。"],
    ["friend","Did you rent a bike to explore?","妳有租腳踏車逛嗎？"],
    ["you","I thought about it, but it was too hot, so I just walked instead.","有想過，不過天氣太熱，我就用走的。"],
    ["friend","Did you take any breaks?","有休息一下嗎？"],
    ["you","I sat by the riverside for a long time and opened Claude Code to keep working.","我在河岸邊坐了很久，打開 Claude Code 繼續工作。"],
    ["friend","Time must have flown by.","時間一定過得很快吧。"],
    ["you","It really did, I completely lost track of time.","真的，我完全忘了時間。"],
    ["friend","Did you see anything else on the island?","島上還有看到什麼嗎？"],
    ["you","There's an art museum, and two pieces really stuck with me.","有一間美術館，其中兩幅作品讓我印象很深。"],
    ["friend","What were they about?","是關於什麼主題？"],
    ["you","One explored how AI makes us more productive, but maybe weakens human connection.","其中一個探討 AI 讓我們生產力變高，但人與人之間的連結卻可能因此變弱。"],
    ["friend","That's a heavy topic for a day trip!","對一日遊來說是滿沉重的主題！"],
    ["you","Right? With AI handling so much, do we even need to express our inner feelings anymore?","對吧？當 AI 能處理這麼多事，我們還需要表達內心的感受嗎？"],
    ["friend","Or maybe when we're alone, without any pretense, our instincts are still there underneath.","或許當我們獨處、卸下防備時，那些本能其實還是在的。"],
    ["you","Exactly, that's what I kept thinking about while I sat there.","沒錯，我坐在那裡的時候一直在想這件事。"],
    ["friend","Is there someone you want to share all this with?","有想跟誰分享這些想法嗎？"],
    ["you","Yeah, there's someone whose personality really draws me in.","有，有一個人的特質很吸引我。"],
    ["friend","What's their personality like?","他的特質是什麼樣子？"],
    ["you","They use AI constantly in daily life, always chasing the newest technology.","他日常高頻使用 AI，不斷追求最新的技術發展。"],
    ["friend","That sounds intense.","聽起來很強烈。"],
    ["you","But at the same time, they truly crave a simple life in the forest, away from all technology.","但同時他也真心渴望森林裡那種脫離科技的生活。"],
    ["friend","That's a striking contrast.","這個反差很鮮明。"],
    ["you","And they actually live that way — it's not just talk.","而且他真的落實在日常裡，不只是說說而已。"],
    ["friend","How would you describe them?","妳會怎麼形容他？"],
    ["you","Their inner world feels like the ocean — wide, open, and able to adjust like the tides.","他的內在像海洋一樣——寬廣遼闊，也能像潮汐一樣自我調節。"],
    ["friend","How was the bachata social, by the way?","對了，巴恰塔的社交場怎麼樣？"],
    ["you","Even quieter, only four people total.","更少人，總共只有四個。"],
    ["friend","That's a small turnout.","人數滿少的。"],
    ["you","It was a little disappointing, honestly.","老實說有點小可惜。"],
    ["friend","Did they explain why?","有解釋原因嗎？"],
    ["you","The host said weekdays are quiet, weekends get much busier.","主辦人說平日人比較少，週末才會多很多。"],
    ["friend","Would you recommend Nami Island to other travelers?","你會推薦其他旅人去南怡島嗎？"],
    ["you","Absolutely, especially if they love nature and quiet walks.","一定會，尤其是喜歡大自然跟安靜散步的人。"],
  ]},
  d0828:{title:"8/28 · 南山咖啡 猛男秀", lines:[
    ["friend","What's your plan for today, your last full day?","妳最後一整天的計畫是什麼？"],
    ["you","I'm working remotely from a cafe near Namsan this morning.","今早我要在南山附近的咖啡廳遠距工作。"],
    ["friend","A cafe for work? Does it have outlets?","去咖啡廳工作？有插座嗎？"],
    ["you","Yes, I checked in advance, it's known for being laptop-friendly.","有，我先查過了，那間以適合帶筆電工作出名。"],
    ["friend","How long are you staying there?","妳會待多久？"],
    ["you","About six hours, until 3:20 in the afternoon.","大概六小時，待到下午三點二十分。"],
    ["friend","What's after that?","那之後呢？"],
    ["you","I'm going to a show called Wild Wild, it's a male revue.","我要去看一場叫 Wild Wild 的猛男秀。"],
    ["friend","That sounds fun! What time does it start?","聽起來很好玩！幾點開始？"],
    ["you","The show starts at 4 PM, so I need to hurry a bit after the cafe.","四點開演，所以離開咖啡廳後要趕一下。"],
    ["friend","Did you already do your grocery shopping?","妳已經去超市買東西了嗎？"],
    ["you","Yes, actually I did that last night after getting back from Nami Island.","對，其實昨晚從南怡島回來後就買好了。"],
    ["friend","Smart, one less thing to worry about today.","真聰明，今天就少一件事要煩惱。"],
    ["you","Exactly! After the show, I'll just walk around Namsan and have dinner.","沒錯！看完秀後，我會在南山走走、吃晚餐。"],
    ["friend","Are you going dancing again tonight?","妳今晚還會去跳舞嗎？"],
    ["you","No, I decided to skip it because of my skin procedure.","不會，因為皮膚療程的關係我決定跳過。"],
    ["friend","That makes sense, better to rest after the treatment.","有道理，療程後還是多休息比較好。"],
    ["you","Right, I'm heading to the airport early instead to relax.","對，我改成提早去機場休息。"],
    ["friend","No overnight sauna this time?","這次不去汗蒸幕過夜了嗎？"],
    ["you","Actually I booked a different one — just for a quick shower before the overnight flight.","其實我改訂了另一間——只是想在紅眼班機前快速洗個澡。"],
    ["friend","By the way, what have you mostly been eating this trip?","對了，這趟大部分都吃什麼？"],
    ["you","Honestly, mostly convenience store food, just for convenience.","老實說大部分是便利商店，圖個方便。"],
    ["friend","Did you have a proper sit-down meal at all?","有好好坐下來吃過一頓正式的嗎？"],
    ["you","Yes, my last dinner was Korean BBQ.","有，我最後一頓晚餐吃了烤肉。"],
    ["friend","How was it?","怎麼樣？"],
    ["you","Great, though most Korean BBQ places require a minimum of two people.","很棒，不過大部分烤肉店都要兩人以上才能點。"],
    ["friend","Anything else that surprised you here?","還有什麼讓妳意外的嗎？"],
    ["you","The amount of coffee people drink here is incredible.","這裡的人喝咖啡的量真的很驚人。"],
    ["friend","Really? More than you expected?","真的？比妳想的還多？"],
    ["you","Yes, even late at night, cafes are still full of people drinking coffee.","對，連很晚的消夜時段，咖啡店都還坐滿在喝咖啡的人。"],
    ["friend","Did you actually see Namsan Tower up close?","你有近距離看到南山塔嗎？"],
    ["you","Yes, I walked around the base of it after the show.","有，看完秀之後我在塔底繞了一圈。"],
    ["friend","Did you go up to the observation deck?","有上去觀景台嗎？"],
    ["you","No, I just admired it from outside, I was short on time.","沒有，我只是在外面欣賞，時間不太夠。"],
    ["friend","How was the cafe's wifi for working?","咖啡廳的網路工作起來怎麼樣？"],
    ["you","Really stable, I didn't have any connection issues all morning.","很穩定，整個早上都沒有斷線問題。"],
    ["friend","Did you order more than one coffee while working?","工作時有點超過一杯咖啡嗎？"],
    ["you","Just two, I tried to pace myself since I was there so long.","只點了兩杯，因為待太久了我有控制一下。"],
    ["friend","What was the show actually like?","那場秀實際上是什麼樣子？"],
    ["you","Honestly, kind of boring, I kept yawning through most of it.","老實說有點無聊，大部分時間我都在打哈欠。"],
    ["friend","Really? Your friends said it was a must-see!","真的？你朋友都說是必看的耶！"],
    ["you","I know, but muscular guys just aren't really my type.","我知道，不過肌肉型的男生真的不是我的菜。"],
    ["friend","What was it actually like on stage?","舞台上實際上是什麼樣子？"],
    ["you","It felt more like watching smaller-scale bodybuilders dancing, with some flirty moments with the audience.","感覺比較像看幾個比較小型的健美先生在跳舞，偶爾會有跟觀眾調情的橋段。"],
    ["friend","Was there anything you actually enjoyed?","有沒有什麼你真的喜歡的部分？"],
    ["you","Yes, there was one modern dance segment, the only part where the whole audience stayed quiet instead of screaming.","有，其中一段現代舞，是全場唯一大家都安靜、沒人尖叫的段落。"],
    ["friend","Who else was in the audience?","觀眾還有誰？"],
    ["you","About 80% of the crowd looked Chinese, and some of them even brought gifts for the performers.","大概八成觀眾看起來是中國人，有些人甚至帶禮物給表演者。"],
    ["friend","That's a lot of dedication!","太熱情了吧！"],
    ["you","Right, so I left just before the encore to avoid the crowd on the way out.","對啊，所以安可前我就先離場了，避開散場人潮。"],
    ["friend","What did you have for dinner near Namsan?","南山附近晚餐吃了什麼？"],
    ["you","I found a small restaurant serving spicy stew, it was delicious.","我找到一間賣辣鍋的小餐廳，很好吃。"],
    ["friend","Did you walk a lot after dinner?","晚餐後有走很多路嗎？"],
    ["you","Yes, I strolled around for almost thirty minutes before heading back.","有，回去之前散步了將近三十分鐘。"],
    ["friend","Was it hard to find your way back to the guesthouse for your luggage?","回民宿拿行李會不會不好找路？"],
    ["you","Not really, I'd already memorized the route from the past few days.","不會，前幾天已經把路線記熟了。"],
    ["friend","How did you feel leaving the guesthouse for the last time?","最後一次離開民宿是什麼感覺？"],
    ["you","A little sad, it really started to feel like home.","有點感傷，那裡真的開始有家的感覺了。"],
    ["friend","What time did you head to the airport?","你幾點出發去機場？"],
    ["you","I left around 8:30 PM to catch the AREX train.","我大約晚上 8:30 出發搭 AREX。"],
    ["friend","Did you use T-money for that ride?","那趟有用 T-money 嗎？"],
    ["you","Yes, exactly as planned, it was cheaper than buying a paper ticket.","有，照計畫用的，比買紙本票便宜。"],
    ["friend","How busy was the train?","車上人多嗎？"],
    ["you","Not too busy, I even got a seat the whole way.","不太多，我全程都有位子坐。"],
    ["friend","Any last regrets about today?","今天有什麼遺憾嗎？"],
    ["you","Just that I couldn't linger longer at the cafe, but everything else went smoothly.","只是不能在咖啡廳待久一點，不過其他都很順利。"],
    ["friend","How are you feeling about tomorrow's flight?","對明天的班機感覺怎麼樣？"],
    ["you","A little nostalgic already, but ready to finally rest.","已經有點不捨了，不過也準備好要好好休息了。"],
  ]},
  d0829:{title:"8/29 · 回程", lines:[
    ["friend","So you spent the night at the airport?","所以妳在機場過夜了？"],
    ["you","Yes, I rested on a bench at the transportation center.","對，我在交通中心的長椅上休息。"],
    ["friend","Was it comfortable?","舒服嗎？"],
    ["you","Not really, but I brought a big scarf and an eye mask.","不太舒服，不過我帶了大披肩和眼罩。"],
    ["friend","What time is your flight?","妳的班機幾點？"],
    ["you","It departs at 7:55 in the morning.","早上 7:55 起飛。"],

/* ── render ── */
const tabs = [["vocab","單字","VOCAB"],["d0825","8/25","ARRIVE"],["d0826","8/26","HANBOK"],["d0827","8/27","NAMI"],["d0828","8/28","SHOW"],["d0829","8/29","HOME"]];
const tabbar = document.getElementById("tabbar");
tabs.forEach(([id,num,label])=>{
  const b = document.createElement("button");
  b.dataset.tab = id;
  b.innerHTML = `<b>${num}</b><i>${label}</i>`;
  b.onclick = ()=>go(id);
  tabbar.appendChild(b);
});

function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.92;
  window.speechSynthesis.speak(u);
}

function renderVocab(){
  let cats = VOCAB.map(c=>c[0]);
  let html = `<div class="sec-head"><h2>單字量 · 100</h2><p>點卡片看中文意思跟例句，點喇叭聽發音。</p></div>`;
  html += `<div class="catbar" id="catbar">` + cats.map((c,i)=>`<button data-cat="${i}" class="${i===0?'':''}">${c}</button>`).join('') + `</div>`;
  VOCAB.forEach(([cat, words], ci)=>{
    html += `<div class="cat-block" id="cat-${ci}"><h3>${cat} · ${words.length}</h3><div class="vocab-grid">`;
    words.forEach(([en,zh,ex])=>{
      html += `<div class="vcard" onclick="this.classList.toggle('flip')">
        <button class="spk" onclick="event.stopPropagation();speak('${en.replace(/'/g,"\\'")}')">▶</button>
        <div class="en">${en}</div>
        <div class="zh">${zh}</div>
        <div class="ex">${ex}</div>
      </div>`;
    });
    html += `</div></div>`;
  });
  document.getElementById("wrap").innerHTML = html;
  document.querySelectorAll("#catbar button").forEach(btn=>{
    btn.onclick = ()=>{
      document.getElementById(`cat-${btn.dataset.cat}`).scrollIntoView({behavior:'smooth', block:'start'});
    };
  });
}

function renderDay(id){
  const d = DIALOGUES[id];
  let html = `<div class="dayhead">
    <div class="sec-head"><h2>${d.title}</h2><p>跟朋友來回聊天練習 · 共 ${d.lines.length} 句</p></div>
    <button class="togglezh" id="zhToggle">隱藏中文</button>
  </div>`;
  html += `<div class="convo body" id="convoBody">`;
  d.lines.forEach(([who,en,zh])=>{
    const label = who === 'you' ? '你' : '朋友';
    html += `<div class="bub-row ${who}">
      <div class="bub">
        <div class="who">${label}</div>
        <div class="en">${en}<button class="spk-line" onclick="speak('${en.replace(/'/g,"\\'")}')">▶</button></div>
        <div class="zh">${zh}</div>
      </div>
    </div>`;
  });
  html += `</div>`;
  document.getElementById("wrap").innerHTML = html;
  document.getElementById("zhToggle").onclick = ()=>{
    const body = document.getElementById("convoBody");
    const btn = document.getElementById("zhToggle");
    body.classList.toggle("hidezh");
    btn.classList.toggle("off");
    btn.textContent = body.classList.contains("hidezh") ? "顯示中文" : "隱藏中文";
  };
}

function go(id){
  document.querySelectorAll(".tabbar button").forEach(b=>b.classList.toggle("on", b.dataset.tab === id));
  if(id === "vocab") renderVocab(); else renderDay(id);
  window.scrollTo({top:0});
  try{ localStorage.setItem('pr_tab', id); }catch(e){}
}

/* mode toggle */
const modeBtn = document.getElementById("modeBtn");
function applyMode(m){
  document.documentElement.setAttribute('data-mode', m);
  modeBtn.textContent = m === 'dark' ? '◑' : '◐';
}
modeBtn.onclick = ()=>{
  const cur = document.documentElement.getAttribute('data-mode');
  const next = cur === 'dark' ? 'light' : 'dark';
  applyMode(next);
  try{ localStorage.setItem('pr_mode', next); }catch(e){}
};
let savedMode = 'light';
try{ savedMode = localStorage.getItem('pr_mode') || 'light'; }catch(e){}
applyMode(savedMode);

let startTab = 'vocab';
try{ startTab = localStorage.getItem('pr_tab') || 'vocab'; }catch(e){}
go(startTab);
</script>
